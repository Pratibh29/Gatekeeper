[project]
name = "security-triage-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "openai-agents>=0.1.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pygithub>=2.3.0",
    "langfuse>=2.0.0",
    "pydantic>=2.0.0",
    "deepeval>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
packages = ["mcp_server", "mcp_server.tools", "triage_agents", "state", "webhook", "observability"]
